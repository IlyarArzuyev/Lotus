<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Чат сотрудников</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #chat {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow-y: auto;
      height: 400px;
      margin-bottom: 10px;
    }
    .message {
      margin: 5px 0;
    }
    .meta {
      font-size: 12px;
      color: gray;
    }
    #typing {
      font-style: italic;
      color: green;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      width: 100%;
      max-width: 600px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<h2>Чат сотрудников</h2>
<input id="username" placeholder="Введите ваше имя" />
<div id="chat"></div>
<div id="typing"></div>
<input id="messageInput" placeholder="Введите сообщение..." />
<button onclick="sendMessage()">Отправить</button>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
  // ✅ Замените на свой Firebase config:
  const firebaseConfig = {
    apiKey: "AIzaSyDnEgFL-We7xG7-HYdrdpwrXV7oA-DUBEA",
    authDomain: "database-214e2.firebaseapp.com",
    databaseURL: "https://database-214e2-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "database-214e2",
    storageBucket: "database-214e2.firebasestorage.app",
    messagingSenderId: "145453239041",
    appId: "1:145453239041:web:6f78fb7fbac0645b04e900"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const usernameInput = document.getElementById('username');
  const messageInput = document.getElementById('messageInput');
  const chat = document.getElementById('chat');
  const typingDiv = document.getElementById('typing');

  let username = '';
  usernameInput.addEventListener('change', () => {
    username = usernameInput.value.trim();
  });

  function sendMessage() {
    if (!username) {
      alert("Введите имя!");
      return;
    }

    const text = messageInput.value.trim();
    if (text === '') return;

    const now = new Date();
    const timestamp = now.toLocaleTimeString() + ' ' + now.toLocaleDateString();

    db.ref('messages').push({
      username: username,
      text: text,
      time: timestamp
    });

    messageInput.value = '';
    db.ref('typing').remove();
  }

  // Получение сообщений
  db.ref('messages').on('child_added', (snapshot) => {
    const msg = snapshot.val();
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = `<strong>${msg.username}:</strong> ${msg.text} <div class="meta">${msg.time}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });

  // "Печатает..."
  messageInput.addEventListener('input', () => {
    if (username) {
      db.ref('typing').set(username);
    }
  });

  // Удаление "печатает" через 2 секунды неактивности
  let typingTimeout;
  messageInput.addEventListener('keydown', () => {
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      db.ref('typing').remove();
    }, 2000);
  });

  db.ref('typing').on('value', (snapshot) => {
    const typingUser = snapshot.val();
    if (typingUser && typingUser !== username) {
      typingDiv.innerText = `${typingUser} печатает...`;
    } else {
      typingDiv.innerText = '';
    }
  });
</script>

</body>
</html>
