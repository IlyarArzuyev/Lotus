<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат на Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #chat-container { max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; }
        #message-input { width: 80%; }
        #send-button { padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>Чат</h1>

<div id="chat-container"></div>

<input type="text" id="message-input" placeholder="Введите сообщение">
<button id="send-button">Отправить</button>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>

<script>
// Ваши данные Firebase
const firebaseConfig = {
apiKey: "AIzaSyDnEgFL-We7xG7-HYdrdpwrXV7oA-DUBEA",
  authDomain: "database-214e2.firebaseapp.com",
  databaseURL: "https://database-214e2-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "database-214e2",
  storageBucket: "database-214e2.firebasestorage.app",
  messagingSenderId: "145453239041",
  appId: "1:145453239041:web:6f78fb7fbac0645b04e900"
};



// Инициализация Firebase
const app = firebase.initializeApp(firebaseConfig);
const database = firebase.database(app);

// Ссылка на чат
const messageRef = database.ref('chats/your-chat-id');

// Функция для отправки сообщений
document.getElementById('send-button').addEventListener('click', () => {
    const messageInput = document.getElementById('message-input');
    const messageText = messageInput.value.trim();

    if (messageText !== '') {
        const message = {
            sender: "username",  // Здесь можно использовать реальное имя пользователя
            text: messageText,
            timestamp: Date.now()
        };

        // Отправка сообщения в Firebase
        messageRef.push(message);
        messageInput.value = ''; // Очистить поле ввода
    }
});

// Функция для загрузки сообщений
function loadMessages() {
    messageRef.on('child_added', function(snapshot) {
        const message = snapshot.val();
        const messageElement = document.createElement('div');
        messageElement.classList.add('message');
        messageElement.textContent = `${message.sender}: ${message.text}`;
        document.getElementById('chat-container').appendChild(messageElement);
    });
}

// Загрузка сообщений при старте
loadMessages();
</script>

</body>
</html>
