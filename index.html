<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expert Credit</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #particles-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 15px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
      animation: popIn 0.8s forwards;
    }
    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .login-title {
      color: #FF4500;
      font-size: 28px;
      margin-bottom: 20px;
      animation: fadeInTitle 1s ease-in-out;
    }
    @keyframes fadeInTitle {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .login-form input {
      background: #003366;
      border: 2px solid #FF4500;
      border-radius: 8px;
      color: #FFFFFF;
      padding: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
      animation: fadeInInput 1s ease-in-out;
    }
    @keyframes fadeInInput {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-form input::placeholder {
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
    }
    .login-form input:focus {
      border-color: #FF6347;
      box-shadow: 0 0 8px rgba(255, 99, 71, 0.5);
    }
    .login-form button {
      background: #FF4500;
      border: none;
      border-radius: 8px;
      color: #FFFFFF;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: fadeInButton 1s ease-in-out;
    }
    @keyframes fadeInButton {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .login-form button:hover {
      background: #FF6347;
      transform: scale(1.05);
    }
    .login-container img {
      width: 200px;
      height: auto;
    }
    #error-message {
      color: #FF6347;
      margin-top: 20px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <div class="login-container">
    <h2 class="login-title">Вход в систему</h2>
    <div class="login-form">
      <input type="text" id="username" placeholder="Логин">
      <input type="password" id="password" placeholder="Пароль">
      <button onclick="login()">Войти</button>
      <p id="error-message">Неверный логин или пароль</p>
    </div>
    <br><br>
    <img src="logo-default-480x80.png" alt="Logo">
  </div>

  <!-- Подключаем particles.js -->
  <script>
    // Инициализация частиц
    particlesJS('particles-js', {
      "particles": {
        "number": {
          "value": 80,
          "density": {
            "enable": true,
            "value_area": 700
          }
        },
        "color": { "value": "#FF4500" },
        "shape": {
          "type": "circle",
          "stroke": { "width": 0, "color": "#000000" },
          "polygon": { "nb_sides": 5 }
        },
        "opacity": {
          "value": 0.5,
          "random": false,
          "anim": { "enable": false }
        },
        "size": {
          "value": 3,
          "random": true,
          "anim": { "enable": false }
        },
        "line_linked": { "enable": false },
        "move": {
          "enable": true,
          "speed": 2,
          "direction": "none",
          "random": false,
          "straight": false,
          "out_mode": "out"
        }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" },
          "resize": true
        }
      },
      "retina_detect": true
    });

    // Функция авторизации
	function login() {
	  const username = document.getElementById('username').value;
	  const password = document.getElementById('password').value;

	  const scriptURL = "https://script.google.com/macros/s/AKfycbxjVv_8NEInYu0Fbh8qlC9r4lD1OCPJdmTITVTsW8Dvy8Kxgs0KpYZSt1J3Rv5oLXOD/exec";//Ссылка на Google Apps Script

	  fetch(`${scriptURL}?username=${username}&password=${password}`)
	    .then(response => response.text())
	    .then(url => {
	      if (url !== "error") {
	        window.location.href = url; // Перенаправление на нужную ссылку
	      } else {
	        document.getElementById('error-message').style.display = 'block';
	      }
	    })
	    .catch(error => console.error("Ошибка запроса:", error));
	}
	
  </script>
</body>
</html>
